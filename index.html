<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lie Atlas — Symmetry for Physicists</title>
    <meta name="description" content="An interactive atlas of Lie groups and Lie algebras, built for physical intuition: generators, commutators, spin, spacetime and particle symmetries." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%239085e9' stroke-width='5'/%3E%3Cpath d='M54 10 L54 54' stroke='%23d95926' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='54' cy='32' r='5' fill='%23d95926'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme before first paint (no flash). Storage may be unavailable.
      try {
        var t = localStorage.getItem('lie-atlas-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar" aria-label="Contents"></aside>
      <div class="sidebar-scrim" id="scrim"></div>
      <main class="main" id="main" tabindex="-1"></main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
